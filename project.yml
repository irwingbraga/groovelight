name: Groovelight
options:
  bundleIdPrefix: dev.irwingbraga
  deploymentTarget:
    macOS: "15.0"
    iOS: "26.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  GroovelightKit:
    path: GroovelightKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.5.0
targets:
  Groovelight:
    type: application
    platform: macOS
    # A shared scheme, so `xcodebuild -scheme Groovelight` works on a freshly generated project.
    scheme: {}
    sources:
      - App/Sources
      - path: App/Resources
        excludes:
          - "Groovelight.icon/**"
      # An Icon Composer document is one file for Xcode (compiled into the asset catalog), not a folder of resources.
      - path: App/Resources/Groovelight.icon
        type: file
        buildPhase: resources
      # Licenses of the included software (Help, Acknowledgements).
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: GroovelightKit
        product: PlayerCore
      - package: GroovelightKit
        product: LibraryKit
      - package: GroovelightKit
        product: Visualizers
      - package: GroovelightKit
        product: MetadataKit
      - package: GroovelightKit
        product: Scrobbler
      - package: GroovelightKit
        product: WirelessSync
      - package: GroovelightKit
        product: ControlKit
      - package: Sparkle
      # The command line tool, inside the app (Contents/Helpers/groovelight).
      - target: groovelight-cli
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    entitlements:
      path: App/Groovelight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        # Wireless sync: the Android app connects to Groovelight on the local network.
        com.apple.security.network.server: true
        # Sparkle installs updates through its XPC services (sandboxed apps must be allowed to reach them).
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        # The command line tool reaches the app on a message port named after this group (ControlKit's ControlPort).
        com.apple.security.application-groups:
          - MHW58UT524.dev.irwingbraga.groovelight
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Groovelight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSLocalNetworkUsageDescription: Groovelight syncs music with the Groovelight Sync app on your Android players and phones over the local network.
        NSBonjourServices: [_groovelight._tcp]
        # The Mac is reached by its address on the local network: pairing over HTTP, then HTTPS with its pinned
        # certificate (which no public authority signs).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Updates (Sparkle): the appcast published with each GitHub release, signed with the EdDSA key below.
        SUFeedURL: https://github.com/irwingbraga/groovelight/releases/latest/download/appcast.xml
        SUPublicEDKey: twg01yBaUF9k29yow7s+wAGu5Iucbw7btMg2Panx7D0=
        SUEnableInstallerLauncherService: true
        # Music the app can be opened with (Open With, the Dock icon, the command line tool): imported. Alternate, so
        # Groovelight never becomes the default app for these.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Music
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.folder, public.zip-archive, org.7-zip.7-zip-archive, com.rarlab.rar-archive,
                                 public.tar-archive, org.gnu.gnu-zip-archive, public.bzip2-archive, org.tukaani.xz-archive]
          - CFBundleTypeName: Cue Sheet
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            CFBundleTypeExtensions: [cue]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.irwingbraga.groovelight.backup
            UTTypeDescription: Groovelight Backup
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [groovelightbackup]
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.irwingbraga.groovelight
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Groovelight
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  # Groovelight for iPhone, iPad and iPhone Duo (see the plan in Obsidian, "Groovelight for iOS and iPadOS").
  Groovelight iOS:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - iOS/Sources
      - path: App/Resources/Assets.xcassets
      # The same Icon Composer icon as the Mac's.
      - path: App/Resources/Groovelight.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: GroovelightKit
        product: PlayerCore
      - package: GroovelightKit
        product: LibraryKit
      - package: GroovelightKit
        product: WirelessSync
      - package: GroovelightKit
        product: WirelessSyncClient
      - package: GroovelightKit
        product: MetadataKit
      - package: GroovelightKit
        product: Visualizers
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Groovelight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Plays with the screen off and the app in the background.
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Groovelight finds your Mac on the local network to sync your music with it.
        NSBonjourServices: [_groovelight._tcp]
        # Every orientation: the layout follows the window (iPhone Duo's displays and poses, iPad multitasking).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft,
                                           UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
                                                UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Groovelight
        PRODUCT_BUNDLE_IDENTIFIER: dev.irwingbraga.groovelight
        # iPhone (iPhone Duo included) and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MHW58UT524
        ASSETCATALOG_COMPILER_APPICON_NAME: Groovelight
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  # `groovelight`: controls the running app from the terminal (and AI tools). Embedded in the app.
  groovelight-cli:
    type: tool
    platform: macOS
    sources:
      - CLI/Sources
    dependencies:
      - package: GroovelightKit
        product: ControlKit
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: groovelight
        PRODUCT_BUNDLE_IDENTIFIER: dev.irwingbraga.groovelight.cli
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
