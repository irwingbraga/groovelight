name: Release

# Builds Groovelight, packages a DMG and publishes it on a GitHub Release.
# - Push a tag like v0.2.0 to release that version.
# - Or run it from the Actions tab: set a version, and turn "publish" off for a test build (the DMG is kept as an
#   artifact of the run instead).
#
# Signing is ad-hoc unless the Developer ID secrets below exist; notarization also needs the App Store Connect key:
#   DEVELOPER_ID_P12             base64 of the "Developer ID Application" certificate exported as .p12
#   DEVELOPER_ID_P12_PASSWORD    its export password
#   DEVELOPER_ID_IDENTITY        e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY_P8                base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID
# Updates (Sparkle) and the Android app:
#   SPARKLE_PRIVATE_KEY          EdDSA key that signs the update feed (appcast.xml); its public half is in project.yml
#   ANDROID_KEYSTORE             base64 of the release keystore of Groovelight Sync (Android)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0); empty uses MARKETING_VERSION from project.yml"
        required: false
      publish:
        description: "Publish a GitHub Release (off: only keep the DMG as a run artifact)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Secrets cannot be tested in a step's `if`, so their presence is exposed here.
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    outputs:
      version: ${{ steps.dmg.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: GroovelightKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('GroovelightKit/Package.resolved') }}

      - name: Test
        # Playback tests need an audio output device, which the runners do not have.
        run: swift test --package-path GroovelightKit --skip PlaybackTests

      - name: Check the signing secrets
        # A half-configured set (a name without its certificate, say) would fail later with Xcode's
        # "No certificate matching" error: say plainly which secret is missing instead.
        env:
          HAS_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY != '' }}
          HAS_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD != '' }}
          HAS_NOTARY_ID: ${{ secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' }}
        run: |
          missing=()
          if [ "$HAS_IDENTITY" = true ] || [ "$HAS_DEVELOPER_ID" = true ]; then
            [ "$HAS_IDENTITY" = true ] || missing+=(DEVELOPER_ID_IDENTITY)
            [ "$HAS_DEVELOPER_ID" = true ] || missing+=("DEVELOPER_ID_P12 (base64 of the .p12)")
            [ "$HAS_P12_PASSWORD" = true ] || missing+=(DEVELOPER_ID_P12_PASSWORD)
          fi
          if [ "$HAS_NOTARY_ID" = true ] || [ "$HAS_NOTARY_KEY" = true ]; then
            [ "$HAS_NOTARY_KEY" = true ] || missing+=("NOTARY_KEY_P8 (base64 of the .p8)")
            [ "$HAS_NOTARY_ID" = true ] || missing+=("NOTARY_KEY_ID and NOTARY_ISSUER_ID")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing or empty signing secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Import Developer ID certificate
        if: ${{ env.HAS_DEVELOPER_ID == 'true' }}
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Write notarization key
        if: ${{ env.HAS_NOTARY_KEY == 'true' }}
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build DMG
        id: dmg
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/notary.p8" ]; then export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"; fi
          scripts/make-dmg.sh

      - name: Write the update feed
        # appcast.xml lists this version with the DMG's EdDSA signature; the app reads it from the latest release.
        if: ${{ env.HAS_SPARKLE_KEY == 'true' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.dmg.outputs.version }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          SPARKLE=build/Release/SourcePackages/artifacts/sparkle/Sparkle/bin
          printf %s "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          mkdir -p build/appcast
          cp "$DMG" build/appcast/
          "$SPARKLE/generate_appcast" --ed-key-file "$RUNNER_TEMP/sparkle.key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v$VERSION/" \
            --full-release-notes-url "https://github.com/${{ github.repository }}/releases/tag/v$VERSION" \
            --link "https://github.com/${{ github.repository }}" \
            -o build/appcast.xml build/appcast
          rm "$RUNNER_TEMP/sparkle.key"
          cat build/appcast.xml

      - name: Pack the Claude Desktop extension
        # Groovelight-<version>.mcpb: installs Groovelight's MCP server (the app's `groovelight mcp`) in Claude Desktop.
        id: mcpb
        run: |
          scripts/make-mcpb.sh build/Release/Build/Products/Release/Groovelight.app build/extension
          echo "file=build/extension/Groovelight-${{ steps.dmg.outputs.version }}.mcpb" >> "$GITHUB_OUTPUT"

      - name: Keep the DMG
        uses: actions/upload-artifact@v4
        with:
          name: Groovelight-${{ steps.dmg.outputs.version }}
          path: |
            ${{ steps.dmg.outputs.dmg }}
            ${{ steps.mcpb.outputs.file }}
            build/appcast.xml

      - name: Publish release
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.dmg.outputs.version }}
          DMG: ${{ steps.dmg.outputs.dmg }}
          MCPB: ${{ steps.mcpb.outputs.file }}
        run: |
          FILES=("$DMG" "$MCPB")
          if [ -f build/appcast.xml ]; then FILES+=(build/appcast.xml); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            # Until 1.0 every release is a preview. GitHub's pre-release flag is not used: /releases/latest skips
            # pre-releases, and the update feed and the README read from it.
            TITLE="Groovelight ${TAG#v}"
            NOTES=""
            if [[ "${TAG#v}" == 0.* ]]; then
              TITLE="$TITLE (Preview)"
              NOTES="> [!NOTE]
          > This is a preview release, not a final 1.0. Expect rough edges and changes between versions, and please report bugs in Issues."
            fi
            # Written release notes (docs/releases/<tag>.md) when there are some, otherwise GitHub's list of changes.
            GENERATED=(--generate-notes)
            if [ -f "docs/releases/$TAG.md" ]; then
              NOTES="$NOTES

          $(cat "docs/releases/$TAG.md")"
              GENERATED=()
            fi
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes "$NOTES" "${GENERATED[@]}" --target "$GITHUB_SHA"
          fi

  android:
    # Groovelight Sync, the Android companion app, attached to the same release.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write the release keystore
        if: ${{ env.HAS_ANDROID_KEY == 'true' }}
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build the APK
        working-directory: android
        env:
          GROOVELIGHT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GROOVELIGHT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -f "$RUNNER_TEMP/release.jks" ]; then export GROOVELIGHT_KEYSTORE="$RUNNER_TEMP/release.jks"; fi
          ./gradlew --no-daemon testDebugUnitTest assembleRelease -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/GroovelightSync-$VERSION.apk"

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: GroovelightSync-${{ env.VERSION }}
          path: ${{ runner.temp }}/GroovelightSync-${{ env.VERSION }}.apk

      - name: Attach to the release
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" "$RUNNER_TEMP/GroovelightSync-$VERSION.apk" --clobber
